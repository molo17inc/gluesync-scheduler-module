# Docker Compose file for testing the Gluesync Scheduler Module (aka Chronos)
# This file is used to run tests in a Docker environment that simulates the CI environment

services:
  test:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DB_URL=sqlite:///./tests/data/test_scheduler.db
      - DEBUG=True
      - GLUESYNC_HOST=http://mock-corehub:8080
      - GLUESYNC_LICENSE_FILE=/opt/gluesync/data/gs-license.dat
      - GLUESYNC_MODULE_TAG=chronos-module
      - SSL_ENABLED=False
      - GLUESYNC_SECURITY_CONFIG=/opt/gluesync/data/security-config.json
      - CRONTAB_USER=root
      - HOST=0.0.0.0
      - TIMEZONE=UTC
    volumes:
      - ./:/app
    command: >
      bash -c "
        echo 'Running tests in CI environment...' &&
        # Initialize and update the Git submodule
        git submodule init &&
        git submodule update &&
        # Install specific websockets version first to avoid compatibility issues
        pip install websockets==11.0.3 &&
        # Set environment variable to use mock implementation
        export USE_MOCK=true &&
        # Install other dependencies
        pip install pytest pytest-cov pytest-mock python-dotenv &&
        # Make sure mock files are executable
        chmod +x tests/run_with_mock.py &&
        mkdir -p /opt/gluesync/data &&
        mkdir -p ./tests/data &&
        echo \"${GLUESYNC_LICENSE_CONTENT}\" > /opt/gluesync/data/gs-license.dat &&
        if [ -f security-config.json ]; then cp security-config.json /opt/gluesync/data/security-config.json; fi &&
        python -m pytest tests/ -v --cov=. --cov-report=term --cov-report=html:coverage-report --junitxml=test-results.xml
      "
    networks:
      - test-network

  mock-corehub:
    image: wiremock/wiremock:latest
    volumes:
      - ./tests/wiremock:/home/wiremock
    ports:
      - "8080:8080"
    command: --verbose
    networks:
      - test-network

networks:
  test-network:
    driver: bridge
