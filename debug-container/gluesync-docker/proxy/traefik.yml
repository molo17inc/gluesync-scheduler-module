entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"

log:
  level: INFO

providers:
  docker:
    exposedByDefault: false
    endpoint: "unix:///var/run/docker.sock"
  file:
    # A directory rather than a single filename so the TLS store and the
    # router pointing at a host-side CoreHub can live in separate files.
    directory: "/etc/traefik/dynamic"
    watch: true
serversTransport:
  insecureSkipVerify: true
