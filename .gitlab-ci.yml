stages:
  - build
  - deploy-windows
  - deploy-manifest

default:
  tags:
    - gs-runners-hq

variables:
  DOCKER_TLS_CERTDIR: ""

build:
  stage: build
  image: docker:latest
  services:
    - name: docker:dind
      variables:
        DOCKER_TLS_CERTDIR: ""
  script:
    - echo "Building & deploying started..."
    - set -euo pipefail

    - apk add --no-cache bash
    # Initialize and update the Git submodule
    - git submodule init
    - git submodule update

    - |
      # Extract version part from tag
      TAGPART=`echo $CI_COMMIT_TAG | grep -oE '[0-9]+\.[0-9]+\.[0-9](.*)'`
      DEFAULT_NAME=${DOCKER_REGISTRY}/${APP_NAME}
      VERSION_TAG="${DEFAULT_NAME}:${TAGPART}"

    # Set up Docker login
    - docker login -u danieleangeli -p "$CI_REGISTRY_PASSWORD"

    # Check if it's a release tag or regular tag and build accordingly
    - |
      if [[ $CI_COMMIT_TAG == release-* ]]; then
        echo "Building multi-architecture release with latest tag..."
        # Install QEMU for multi-architecture builds
        docker run --privileged --rm tonistiigi/binfmt --install all
        # Create and use a new builder instance
        docker buildx create --name multiarch-builder --use
        docker buildx inspect --bootstrap
        
        # Build and push multi-platform images with latest tag
        docker buildx build --platform linux/amd64,linux/arm64 \
          --tag $DEFAULT_NAME:latest \
          --tag "$VERSION_TAG" \
          --push .
      elif [[ $CI_COMMIT_TAG == tag-* ]]; then
        echo "Building amd64-only version without latest tag..."
        # Build and push only amd64 image without latest tag
        docker build --tag "$VERSION_TAG" .
        docker push "$VERSION_TAG"
      else
        echo "Unknown tag format: $CI_COMMIT_TAG"
        exit 1
      fi
  rules:
    - if: $CI_COMMIT_TAG

# Windows deployment jobs
deploy-windows:
  dependencies:
    - build
  stage: deploy-windows
  tags:
    - windows-runner-hq
  script:
    # Stop on first error
    - $ErrorActionPreference = "Stop"
    
    # Docker login with proper error handling
    - |
      Write-Host "Logging into Docker registry..."
      try {
        docker login -u danieleangeli -p "$env:CI_REGISTRY_PASSWORD"
        Write-Host "✅ Docker login successful"
      } catch {
        Write-Error "❌ Docker login failed: $_"
        exit 1
      }
    
    # Extract version information from tag
    - |
      Write-Host "Processing tag: $env:CI_COMMIT_TAG"
      $TAG_PART = $env:CI_COMMIT_TAG -replace '^(release-|tag-)', ''
      $IMAGE_NAME = "molo17/$env:APP_NAME"
      $VERSION_TAG = "${IMAGE_NAME}:${TAG_PART}"
      $VERSION_TAG_WINDOWS = "${IMAGE_NAME}:${TAG_PART}-windows"
      
      Write-Host "Image name: ${IMAGE_NAME}"
      Write-Host "Version tag: ${VERSION_TAG_WINDOWS}"
      
      # Set environment variables for use in build
      $env:IMAGE_NAME = ${IMAGE_NAME}
      $env:VERSION_TAG_WINDOWS = ${VERSION_TAG_WINDOWS}
      $env:TAG_PART = ${TAG_PART}
     
    # Ensure submodules are available in this job too (Windows runner checks out repo separately)
    - |
      Write-Host "Initializing git submodules..."
      git submodule init
      if ($LASTEXITCODE -ne 0) { Write-Error "git submodule init failed"; exit $LASTEXITCODE }
      git submodule update --recursive
      if ($LASTEXITCODE -ne 0) { Write-Error "git submodule update failed"; exit $LASTEXITCODE }
      Write-Host "✅ Submodules ready"

    # Build Windows Docker image
    - |
      Write-Host "Building Windows Docker image..."
      Write-Host "Using Dockerfile: Dockerfile.windows"
      $env:DOCKER_BUILDKIT = 1
      docker build --progress=plain --file Dockerfile.windows --tag "${env:VERSION_TAG_WINDOWS}" .
      if ($LASTEXITCODE -ne 0) {
        Write-Error "❌ Docker build failed with exit code $LASTEXITCODE"
        exit $LASTEXITCODE
      }
      Write-Host "✅ Docker build completed successfully"
    
    # Push Windows Docker image
    - |
      Write-Host "Pushing Windows Docker image..."
      docker push "${env:VERSION_TAG_WINDOWS}"
      if ($LASTEXITCODE -ne 0) {
        Write-Error "❌ Docker push failed with exit code $LASTEXITCODE"
        exit $LASTEXITCODE
      }
      Write-Host "✅ Docker push completed successfully"
      Write-Host "Windows image available at: ${env:VERSION_TAG_WINDOWS}"
    
    # Tag as latest-windows for release branches
    - |
      if ($env:CI_COMMIT_TAG -match '^release-') {
        Write-Host "Tagging as latest-windows..."
        $LATEST_WINDOWS = "${env:IMAGE_NAME}:latest-windows"
        docker tag "${env:VERSION_TAG_WINDOWS}" "${LATEST_WINDOWS}"
        if ($LASTEXITCODE -ne 0) {
          Write-Error "❌ docker tag failed with exit code $LASTEXITCODE"
          exit $LASTEXITCODE
        }
        docker push "${LATEST_WINDOWS}"
        if ($LASTEXITCODE -ne 0) {
          Write-Error "❌ Failed to push latest-windows tag with exit code $LASTEXITCODE"
          exit $LASTEXITCODE
        }
        Write-Host "✅ Latest-windows tag pushed successfully"
      }
  rules:
    - if: $CI_COMMIT_TAG

# Multi-platform deployment job (combines Linux and Windows)
deploy-manifest:
  stage: deploy-manifest
  image: docker:latest
  services:
    - name: docker:dind
      variables:
        DOCKER_TLS_CERTDIR: ""
  dependencies:
    - build
    - deploy-windows
  script:
    - echo "Creating multi-platform manifest..."
    
    # Set up Docker login
    - docker login -u danieleangeli -p "$CI_REGISTRY_PASSWORD"
    
    # Extract version part from tag
    - |
      TAG_PART=$(echo $CI_COMMIT_TAG | sed 's/^\(release-\|tag-\)//')
      IMAGE_NAME="molo17/$APP_NAME"
      VERSION_TAG="${IMAGE_NAME}:${TAG_PART}"
      VERSION_TAG_WINDOWS="${IMAGE_NAME}:${TAG_PART}-windows"
    
    # Check if Windows image exists and create multi-platform manifest accordingly
    - |
      # Check if Windows image exists
      WINDOWS_EXISTS=false
      if docker manifest inspect "$VERSION_TAG_WINDOWS" >/dev/null 2>&1; then
        echo "Windows image found: $VERSION_TAG_WINDOWS"
        WINDOWS_EXISTS=true
      else
        echo "Windows image not found: $VERSION_TAG_WINDOWS"
        echo "Will create Linux-only manifests"
      fi
      
      if [[ $CI_COMMIT_TAG == release-* ]]; then
        echo "Creating manifest for release version..."
        if [ "$WINDOWS_EXISTS" = true ]; then
          # Create multi-platform manifest (Linux + Windows)
          docker manifest create "${VERSION_TAG}" \
            "$VERSION_TAG" \
            "$VERSION_TAG_WINDOWS"
          docker manifest push "${VERSION_TAG}"
          
          docker manifest create "${IMAGE_NAME}:latest" \
            "${IMAGE_NAME}:latest" \
            "${IMAGE_NAME}:latest-windows"
          docker manifest push "${IMAGE_NAME}:latest"
          echo "✅ Created multi-platform manifests (Linux + Windows)"
        else
          # Create Linux-only manifests
          docker manifest create "${VERSION_TAG}" \
            "$VERSION_TAG"
          docker manifest push "${VERSION_TAG}"
          
          docker manifest create "${IMAGE_NAME}:latest" \
            "${IMAGE_NAME}:latest"
          docker manifest push "${IMAGE_NAME}:latest"
          echo "⚠️ Created Linux-only manifests (Windows build unavailable)"
        fi
      elif [[ $CI_COMMIT_TAG == tag-* ]]; then
        echo "Creating manifest for tag version..."
        if [ "$WINDOWS_EXISTS" = true ]; then
          # Create multi-platform manifest (Linux + Windows)
          docker manifest create "${VERSION_TAG}" \
            "$VERSION_TAG" \
            "$VERSION_TAG_WINDOWS"
          docker manifest push "${VERSION_TAG}"
          echo "✅ Created multi-platform manifest (Linux + Windows)"
        else
          # Create Linux-only manifest
          docker manifest create "${VERSION_TAG}" \
            "$VERSION_TAG"
          docker manifest push "${VERSION_TAG}"
          echo "⚠️ Created Linux-only manifest (Windows build unavailable)"
        fi
      fi
  rules:
    - if: $CI_COMMIT_TAG
