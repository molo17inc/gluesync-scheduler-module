stages:
  - test
  - deploy
  - deploy-windows

default:
  tags:
    - gs-runners-hq

variables:
  DOCKER_TLS_CERTDIR: ""
  PYTEST_ADDOPTS: "--color=yes"

.test_template: &test_template
  stage: test
  image: python:3.9
  before_script:
    # Initialize and update the Git submodule
    - git submodule init
    - git submodule update
    # Install specific websockets version first to avoid compatibility issues
    - pip install websockets==11.0.3
    # Copy mock implementation files
    - mkdir -p tests
    - cp -f $CI_PROJECT_DIR/tests/mock_gluesync_sdk.py $CI_PROJECT_DIR/tests/
    - cp -f $CI_PROJECT_DIR/tests/mock_gluesync_sdk_client.py $CI_PROJECT_DIR/tests/
    - cp -f $CI_PROJECT_DIR/tests/run_with_mock.py $CI_PROJECT_DIR/tests/
    - chmod +x $CI_PROJECT_DIR/tests/run_with_mock.py
    # Set environment variable to use mock implementation
    - export USE_MOCK=true
    # Install other dependencies
    - pip install -r requirements.txt
    - pip install pytest pytest-cov python-dotenv
    # Create Gluesync default directories
    - mkdir -p /opt/gluesync/data
    # Use license file from GitLab CI variables
    - echo "$GLUESYNC_LICENSE_CONTENT" > /opt/gluesync/data/gs-license.dat
    # Copy security config if it exists
    - if [ -f security-config.json ]; then cp security-config.json /opt/gluesync/data/security-config.json; fi
    # Set up environment variables for testing
    - export GLUESYNC_LICENSE_FILE=/opt/gluesync/data/gs-license.dat
    - export GLUESYNC_MODULE_TAG=chronos
    - export SSL_ENABLED=False
    - export GLUESYNC_SECURITY_CONFIG=/opt/gluesync/data/security-config.json
    - export DB_URL=sqlite:///./tests/data/test_scheduler.db
    - export DEBUG=True
    - export CORE_HUB_URL=http://mock-corehub:8080
    - export CRONTAB_USER=$USER
    # Set HOST to 0.0.0.0 to bind to all interfaces in CI environment
    - export HOST=0.0.0.0
    # Create test data directory
    - mkdir -p ./tests/data
  artifacts:
    when: always
    reports:
      junit: test-results.xml
    paths:
      - coverage.xml
      - test-results.xml
  rules:
    - if: $CI_COMMIT_TAG == null

unit_tests:
  <<: *test_template
  script:
    - echo "Running unit tests for the scheduler module"
    - python -m pytest tests/test_corehub_integration.py -v --junitxml=test-results.xml --cov=. --cov-report=term --cov-report=xml:coverage.xml
    - ls -la .  # Debug: list files in working directory
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

api_tests:
  <<: *test_template
  script:
    - echo "Running API tests for the scheduler module"
    - python -m pytest tests/test_api.py -v --junitxml=test-results.xml --cov=. --cov-report=term --cov-report=xml:coverage.xml
    - ls -la .  # Debug: list files in working directory
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

cron_job_tests:
  <<: *test_template
  script:
    - echo "Running cron job tests for the scheduler module"
    - python -m pytest tests/test_cron_jobs.py -v --junitxml=test-results.xml --cov=. --cov-report=term --cov-report=xml:coverage.xml
    - ls -la .  # Debug: list files in working directory
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy:
  stage: deploy
  image: docker:latest
  services:
    - name: docker:dind
      variables:
        DOCKER_TLS_CERTDIR: ""
  script:
    - echo "Building & deploying started..."

    - apk add --no-cache bash
    # Initialize and update the Git submodule
    - git submodule init
    - git submodule update

    - |
      # Extract version part from tag
      TAGPART=`echo $CI_COMMIT_TAG | grep -oE '[0-9]+\.[0-9]+\.[0-9](.*)'`
      DEFAULT_NAME=${DOCKER_REGISTRY}/${APP_NAME}
      VERSION_TAG="${DEFAULT_NAME}:${TAGPART}"

    # Set up Docker login
    - docker login -u danieleangeli -p "$CI_REGISTRY_PASSWORD"

    # Check if it's a release tag or regular tag and build accordingly
    - |
      if [[ $CI_COMMIT_TAG == release-* ]]; then
        echo "Building multi-architecture release with latest tag..."
        # Install QEMU for multi-architecture builds
        docker run --privileged --rm tonistiigi/binfmt --install all
        # Create and use a new builder instance
        docker buildx create --name multiarch-builder --use
        docker buildx inspect --bootstrap
        
        # Build and push multi-platform images with latest tag
        docker buildx build --platform linux/amd64,linux/arm64 \
          --tag $DEFAULT_NAME:latest \
          --tag "$VERSION_TAG" \
          --push .
      elif [[ $CI_COMMIT_TAG == tag-* ]]; then
        echo "Building amd64-only version without latest tag..."
        # Build and push only amd64 image without latest tag
        docker build --tag "$VERSION_TAG" .
        docker push "$VERSION_TAG"
      else
        echo "Unknown tag format: $CI_COMMIT_TAG"
        exit 1
      fi
  rules:
    - if: $CI_COMMIT_TAG

# Windows deployment jobs
deploy-windows:
  stage: deploy-windows
  tags:
    - windows-runner-hq
  allow_failure: true
  image: mcr.microsoft.com/powershell:lts-windowsservercore-ltsc2022
  variables:
    GIT_STRATEGY: clone
  before_script:
    - echo "Installing Docker CLI for Windows..."
    - pwsh -Command "Invoke-WebRequest -Uri 'https://download.docker.com/win/static/stable/x86_64/docker-24.0.7.zip' -OutFile 'docker.zip'"
    - pwsh -Command "Expand-Archive -Path 'docker.zip' -DestinationPath 'C:\temp'"
    - pwsh -Command "Copy-Item 'C:\temp\docker\docker.exe' -Destination 'C:\Windows\System32\'"
    - echo "Adding Docker to PATH and verifying installation..."
    - pwsh -Command "$env:PATH += ';C:\Windows\System32'"
    - pwsh -Command "docker --version"
    # Set Docker host to connect to the host daemon
    - pwsh -Command "$env:DOCKER_HOST = 'tcp://host.docker.internal:2375'"
    - pwsh -Command "echo \"DOCKER_HOST set to $env:DOCKER_HOST\""
    # Debug: Check if we can reach the Docker daemon
    - ping host.docker.internal || echo "Cannot ping host.docker.internal"
    - nslookup host.docker.internal || echo "Cannot resolve host.docker.internal"
    # Test Docker connectivity
    - pwsh -Command "docker version" || echo "Docker command failed"
    - pwsh -Command "docker info" || echo "Cannot connect to Docker daemon"
    # Additional Docker connectivity tests
    - echo "Testing Docker daemon connectivity..."
    - pwsh -Command "docker ps 2>&1" || echo "Cannot list containers - Docker daemon may not be accessible"
    - pwsh -Command "echo \"Current DOCKER_HOST $env:DOCKER_HOST\""
    - echo "Testing connection to $env:DOCKER_HOST..."
    - powershell -Command "Test-NetConnection -ComputerName host.docker.internal -Port 2375" || echo "Cannot connect to Docker daemon on port 2375"
  script:
    - echo "Building Windows Docker image..."
    
    # Debug environment variables
    - echo CI_COMMIT_TAG is %CI_COMMIT_TAG%
    - echo CI_REGISTRY_PASSWORD is %CI_REGISTRY_PASSWORD%
    - echo DOCKER_REGISTRY is %DOCKER_REGISTRY%
    - echo APP_NAME is %APP_NAME%
    
    # Extract version part from tag (similar to Linux job) using PowerShell
    - echo Extracting tag part from %CI_COMMIT_TAG%
    - pwsh -Command "$tag = '%CI_COMMIT_TAG%' -match '[0-9]+\.[0-9]+\.[0-9]+'; if ($matches) { $env:TAGPART = $matches[0] } else { $env:TAGPART = '' }"
    - echo Tag part is %TAGPART%
    - set DEFAULT_NAME=%DOCKER_REGISTRY%/%APP_NAME%
    - set VERSION_TAG=%DEFAULT_NAME%:%TAGPART%
    - set VERSION_TAG_WINDOWS=%DEFAULT_NAME%:%TAGPART%-windows
    
    # Set up Docker login
    - pwsh -Command "docker login -u danieleangeli -p '%CI_REGISTRY_PASSWORD%'"
    
    # Check if it's a release tag or regular tag and build accordingly
    - 'pwsh -Command "if (\"$env:CI_COMMIT_TAG\".StartsWith(\"release-\")) { Write-Host \"Building Windows release with latest tag...\"; exit 0 } elseif (\"$env:CI_COMMIT_TAG\".StartsWith(\"tag-\")) { Write-Host \"Building Windows amd64-only version without latest tag...\"; exit 0 } else { Write-Host \"Unknown tag format: $env:CI_COMMIT_TAG\"; exit 1 }"'
    - 'pwsh -Command "if (\"$env:CI_COMMIT_TAG\".StartsWith(\"release-\")) { docker build -f Dockerfile.windows -t \"$env:VERSION_TAG_WINDOWS\" -t \"$env:DEFAULT_NAME:latest-windows\" . }"'
    - 'pwsh -Command "if (\"$env:CI_COMMIT_TAG\".StartsWith(\"release-\")) { docker push \"$env:VERSION_TAG_WINDOWS\" }"'
    - 'pwsh -Command "if (\"$env:CI_COMMIT_TAG\".StartsWith(\"release-\")) { docker push \"$env:DEFAULT_NAME:latest-windows\" }"'
    - 'pwsh -Command "if (\"$env:CI_COMMIT_TAG\".StartsWith(\"tag-\")) { docker build -f Dockerfile.windows -t \"$env:VERSION_TAG_WINDOWS\" . }"'
    - 'pwsh -Command "if (\"$env:CI_COMMIT_TAG\".StartsWith(\"tag-\")) { docker push \"$env:VERSION_TAG_WINDOWS\" }"'
  rules:
    - if: $CI_COMMIT_TAG

# Multi-platform deployment job (combines Linux and Windows)
deploy-manifest:
  stage: deploy-windows
  image: docker:latest
  services:
    - name: docker:dind
      variables:
        DOCKER_TLS_CERTDIR: ""
  dependencies:
    - deploy
    - deploy-windows
  script:
    - echo "Creating multi-platform manifest..."
    
    # Set up Docker login
    - docker login -u danieleangeli -p "$CI_REGISTRY_PASSWORD"
    
    # Extract version part from tag
    - |
      TAGPART=`echo $CI_COMMIT_TAG | grep -oE '[0-9]+\.[0-9]+\.[0-9](.*)'`
      DEFAULT_NAME=${DOCKER_REGISTRY}/${APP_NAME}
      VERSION_TAG="${DEFAULT_NAME}:${TAGPART}"
      VERSION_TAG_WINDOWS="${DEFAULT_NAME}:${TAGPART}-windows"
    
    # Check if Windows image exists and create multi-platform manifest accordingly
    - |
      # Check if Windows image exists
      WINDOWS_EXISTS=false
      if docker manifest inspect "$VERSION_TAG_WINDOWS" >/dev/null 2>&1; then
        echo "Windows image found: $VERSION_TAG_WINDOWS"
        WINDOWS_EXISTS=true
      else
        echo "Windows image not found: $VERSION_TAG_WINDOWS"
        echo "Will create Linux-only manifests"
      fi
      
      if [[ $CI_COMMIT_TAG == release-* ]]; then
        echo "Creating manifest for release version..."
        if [ "$WINDOWS_EXISTS" = true ]; then
          # Create multi-platform manifest (Linux + Windows)
          docker manifest create "$VERSION_TAG-multiplatform" \
            "$VERSION_TAG" \
            "$VERSION_TAG_WINDOWS"
          docker manifest push "$VERSION_TAG-multiplatform"
          
          docker manifest create "${DEFAULT_NAME}:latest-multiplatform" \
            "${DEFAULT_NAME}:latest" \
            "${DEFAULT_NAME}:latest-windows"
          docker manifest push "${DEFAULT_NAME}:latest-multiplatform"
          echo "✅ Created multi-platform manifests (Linux + Windows)"
        else
          # Create Linux-only manifests
          docker manifest create "$VERSION_TAG-multiplatform" \
            "$VERSION_TAG"
          docker manifest push "$VERSION_TAG-multiplatform"
          
          docker manifest create "${DEFAULT_NAME}:latest-multiplatform" \
            "${DEFAULT_NAME}:latest"
          docker manifest push "${DEFAULT_NAME}:latest-multiplatform"
          echo "⚠️ Created Linux-only manifests (Windows build unavailable)"
        fi
      elif [[ $CI_COMMIT_TAG == tag-* ]]; then
        echo "Creating manifest for tag version..."
        if [ "$WINDOWS_EXISTS" = true ]; then
          # Create multi-platform manifest (Linux + Windows)
          docker manifest create "$VERSION_TAG-multiplatform" \
            "$VERSION_TAG" \
            "$VERSION_TAG_WINDOWS"
          docker manifest push "$VERSION_TAG-multiplatform"
          echo "✅ Created multi-platform manifest (Linux + Windows)"
        else
          # Create Linux-only manifest
          docker manifest create "$VERSION_TAG-multiplatform" \
            "$VERSION_TAG"
          docker manifest push "$VERSION_TAG-multiplatform"
          echo "⚠️ Created Linux-only manifest (Windows build unavailable)"
        fi
      fi
  rules:
    - if: $CI_COMMIT_TAG
