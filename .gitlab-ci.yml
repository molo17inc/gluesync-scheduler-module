stages:
  - test
  - build-sonar
  - sandbox-build
  - sandbox
  - deploy

default:
  tags:
    - hq-linux-docker

variables:
  DOCKER_TLS_CERTDIR: ""
  PYTEST_ADDOPTS: "--color=yes"
  PIP_INDEX_URL: "https://nexus.hq.molo17.com/repository/pypi-all/simple"
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  GIT_DEPTH: "0"
  SONAR_PROJECT_KEY: "molo17-public_gluesync_gluesync-scheduler-module_4ca71c42-0404-415f-80de-4f577703721b"
  # buildx registry cache for the Dockerfile builder stage (toolchain + pip deps).
  # The runtime stage is always rebuilt (--no-cache-filter runtime) so apk upgrade
  # keeps pulling the latest OS patches. Nexus needs image-manifest cache mode.
  BUILDCACHE_REF: "nexus.hq.molo17.com/molo17-local/gluesync-chronos-buildcache:main"

include:
  - local: "ci/windows-deploy-template.yml"

# Parallel deployment for multiple Windows Nano Server versions
deploy-windows-nanoserver:
  extends: .windows-deploy-template
  parallel:
    matrix:
      - WINDOWS_TAG: "ltsc2019"
        WINDOWS_RUNNER_VERSION: "2019"
      - WINDOWS_TAG: "ltsc2022"
        WINDOWS_RUNNER_VERSION: "2022"
      # - WINDOWS_TAG: "ltsc2025"
      #   WINDOWS_RUNNER_VERSION: "2025"
  tags:
    - "hq-windows-shell-${WINDOWS_RUNNER_VERSION}"
  # One Windows image build per host at a time: two tag pipelines (alpha + beta cut
  # together) building in parallel on the same runner made Windows fail to start
  # processes (cl.exe 0xC0000142, runner PowerShell crash). Later jobs queue instead.
  resource_group: "windows-runner-${WINDOWS_RUNNER_VERSION}"

# Two Linux images per tag: the default Wolfi image (Dockerfile) and the Debian one (Dockerfile.debian,
# tags with the "-debian" suffix) for CPUs without x86-64-v2, where the Wolfi glibc refuses to start.
# Core Hub publishes the same pair. Each variant keeps its own buildx cache: the builder stages differ.
deploy-linux:
  stage: deploy
  image: docker:latest
  parallel:
    matrix:
      - DOCKER_FILE: "Dockerfile"
        IMAGE_TAG_SUFFIX: ""
      - DOCKER_FILE: "Dockerfile.debian"
        IMAGE_TAG_SUFFIX: "-debian"
  services:
    - name: docker:dind
      variables:
        DOCKER_TLS_CERTDIR: ""
  script:
    - echo "Building & deploying started..."

    - apk add --no-cache bash curl

    - |
      TRIVY_VERSION=$(curl -sfL https://api.github.com/repos/aquasecurity/trivy/releases/latest | grep -oE '"tag_name"\s*:\s*"v[^"]+"' | head -1 | sed -E 's/.*"v([^"]+)"/\1/')
      if [ -z "$TRIVY_VERSION" ]; then
        echo "❌ Unable to resolve latest Trivy version"
        exit 1
      fi
      curl -sfL --retry 3 --retry-delay 2 "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" -o /tmp/trivy.tar.gz
      tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
      install -m 0755 /tmp/trivy /usr/local/bin/trivy
      trivy --version

    - |
      set -euo pipefail

      # Extract version part from tag
      TAGPART=$(echo "$CI_COMMIT_TAG" | grep -oE '[0-9]+\.[0-9]+\.[0-9](.*)')
      DEFAULT_NAME="${DOCKER_REGISTRY}/${APP_NAME}"
      VERSION_TAG="${DEFAULT_NAME}:${TAGPART}${IMAGE_TAG_SUFFIX}"
      CANDIDATE_TAG="${DEFAULT_NAME}:${TAGPART}${IMAGE_TAG_SUFFIX}-candidate-${CI_PIPELINE_ID}"
      VARIANT_BUILDCACHE_REF="${BUILDCACHE_REF}${IMAGE_TAG_SUFFIX}"

      # Determine release type based on tag prefix
      if [[ "$CI_COMMIT_TAG" == release-* ]]; then
        RELEASE_TYPE="GA"
      elif [[ "$CI_COMMIT_TAG" == beta-* ]]; then
        RELEASE_TYPE="BETA"
      elif [[ "$CI_COMMIT_TAG" == tag-* ]]; then
        RELEASE_TYPE="ALPHA"
      else
        echo "Unknown tag format: $CI_COMMIT_TAG"
        exit 1
      fi

      LOWER_RELEASE_DIR=$(echo "$RELEASE_TYPE" | tr '[:upper:]' '[:lower:]')
      FTP_RELEASE_DIR="/releases/${LOWER_RELEASE_DIR}/linux"

      export TAGPART DEFAULT_NAME VERSION_TAG CANDIDATE_TAG VARIANT_BUILDCACHE_REF RELEASE_TYPE FTP_RELEASE_DIR LOWER_RELEASE_DIR

      # Create VERSION file
      echo "${TAGPART}" > VERSION
      echo "VERSION file created with content: $(cat VERSION)"

    # Set up Docker login
    - docker login -u danieleangeli -p "$CI_REGISTRY_PASSWORD"
    - docker login -u gluesync -p "$NEXUS_REPO_PASSWORD" nexus.hq.molo17.com

    - |
      NEXUS_NAME="nexus.hq.molo17.com/molo17-local/${APP_NAME}"

    # Check if it's a release tag, beta tag, or regular tag and build accordingly
    - |
      if [[ $CI_COMMIT_TAG == release-* ]]; then
        echo "Building multi-architecture release with latest tag..."
        # Install QEMU for multi-architecture builds
        docker run --privileged --rm tonistiigi/binfmt --install all
        # Create and use a new builder instance
        docker buildx create --name multiarch-builder --use
        docker buildx inspect --bootstrap
        
        # Build and push multi-platform candidate image
        docker buildx build --platform linux/amd64,linux/arm64 -f "$DOCKER_FILE" \
          --no-cache-filter runtime \
          --cache-from "type=registry,ref=${VARIANT_BUILDCACHE_REF}" \
          --cache-to "type=registry,ref=${VARIANT_BUILDCACHE_REF},mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true" \
          --tag "$CANDIDATE_TAG" \
          --push .

      echo "Running Trivy scan on candidate image $CANDIDATE_TAG"
      trivy image \
        --exit-code 0 \
        --severity HIGH,CRITICAL \
        --ignore-unfixed \
        --no-progress \
        "$CANDIDATE_TAG"

        echo "Promoting candidate image to release tags"
        docker buildx imagetools create --tag "$DEFAULT_NAME:latest${IMAGE_TAG_SUFFIX}" --tag "$VERSION_TAG" "$CANDIDATE_TAG"

        echo "Pushing release tags to Nexus"
        docker buildx imagetools create --tag "${NEXUS_NAME}:latest${IMAGE_TAG_SUFFIX}" --tag "${NEXUS_NAME}:${TAGPART}${IMAGE_TAG_SUFFIX}" "$CANDIDATE_TAG"
      elif [[ $CI_COMMIT_TAG == beta-* ]]; then
        echo "Building multi-architecture beta with beta tag..."
        # Install QEMU for multi-architecture builds
        docker run --privileged --rm tonistiigi/binfmt --install all
        # Create and use a new builder instance
        docker buildx create --name multiarch-builder --use
        docker buildx inspect --bootstrap
        
        # Build and push multi-platform candidate image
        docker buildx build --platform linux/amd64,linux/arm64 -f "$DOCKER_FILE" \
          --no-cache-filter runtime \
          --cache-from "type=registry,ref=${VARIANT_BUILDCACHE_REF}" \
          --cache-to "type=registry,ref=${VARIANT_BUILDCACHE_REF},mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true" \
          --tag "$CANDIDATE_TAG" \
          --push .

        echo "Running Trivy scan on candidate image $CANDIDATE_TAG"
        trivy image \
          --exit-code 0 \
          --severity HIGH,CRITICAL \
          --ignore-unfixed \
          --no-progress \
          "$CANDIDATE_TAG"

        echo "Promoting candidate image to beta tags"
        docker buildx imagetools create --tag "$DEFAULT_NAME:beta${IMAGE_TAG_SUFFIX}" --tag "$VERSION_TAG" "$CANDIDATE_TAG"

        echo "Pushing beta tags to Nexus"
        docker buildx imagetools create --tag "${NEXUS_NAME}:beta${IMAGE_TAG_SUFFIX}" --tag "${NEXUS_NAME}:${TAGPART}${IMAGE_TAG_SUFFIX}" "$CANDIDATE_TAG"
      elif [[ $CI_COMMIT_TAG == tag-* ]]; then
        echo "Building amd64-only alpha image..."
        # buildx with the docker-container builder (needed for the registry cache); --load
        # puts the image in the local daemon for the Trivy scan and the pushes below.
        # Import only: an amd64-only export would overwrite the multi-arch cache of releases.
        docker buildx create --name multiarch-builder --use
        docker buildx inspect --bootstrap
        docker buildx build --platform linux/amd64 -f "$DOCKER_FILE" \
          --no-cache-filter runtime \
          --cache-from "type=registry,ref=${VARIANT_BUILDCACHE_REF}" \
          --tag "$CANDIDATE_TAG" \
          --load .

        echo "Running Trivy scan on candidate image $CANDIDATE_TAG"
        trivy image \
          --exit-code 0 \
          --severity HIGH,CRITICAL \
          --ignore-unfixed \
          --no-progress \
          "$CANDIDATE_TAG"

        docker tag "$CANDIDATE_TAG" "$VERSION_TAG"
        docker push "$VERSION_TAG"

        echo "Pushing alpha tag to Nexus"
        docker tag "$CANDIDATE_TAG" "${NEXUS_NAME}:${TAGPART}${IMAGE_TAG_SUFFIX}"
        docker push "${NEXUS_NAME}:${TAGPART}${IMAGE_TAG_SUFFIX}"
      else
        echo "Unknown tag format: $CI_COMMIT_TAG"
        exit 1
      fi

    # Export per-architecture tarballs to FTP (not for beta tags: beta ships as Docker images only)
    - |
      set -euo pipefail

      if [[ "$CI_COMMIT_TAG" == beta-* ]]; then
        echo "Beta tag: skipping FTP tarball export/upload (Docker Hub + Nexus only)"
        exit 0
      fi

      TAR_DIR="docker-images-linux"
      mkdir -p "$TAR_DIR"
      FILE_BASENAME="${APP_NAME}${IMAGE_TAG_SUFFIX}-${LOWER_RELEASE_DIR}"

      ARCHITECTURES="amd64"
      if [[ $CI_COMMIT_TAG == release-* || $CI_COMMIT_TAG == beta-* ]]; then
        ARCHITECTURES="amd64 arm64"
      fi

      for ARCH in $ARCHITECTURES; do
        TAR_FILE="${TAR_DIR}/${FILE_BASENAME}-${ARCH}.tar.gz"
        echo "Pulling $VERSION_TAG for linux/${ARCH}"
        docker pull --platform "linux/${ARCH}" "$VERSION_TAG"

        echo "Saving Docker image $VERSION_TAG to $TAR_FILE"
        docker save "$VERSION_TAG" | gzip > "$TAR_FILE"

        BASENAME=$(basename "$TAR_FILE")
        echo "Uploading ${BASENAME} to ftp://${FTP_SITE}${FTP_RELEASE_DIR}/"
        curl --fail -T "$TAR_FILE" --user "$FTP_USER:$FTP_PASSWORD" "ftp://${FTP_SITE}${FTP_RELEASE_DIR}/${BASENAME}"

        rm -f "$TAR_FILE"
        docker rmi "$VERSION_TAG" >/dev/null 2>&1 || true
        echo "FTP upload for ${ARCH} completed"
      done
  rules:
    - if: $CI_COMMIT_TAG

update_budibase_version:
  stage: deploy
  image: alpine:latest
  needs:
    - job: deploy-linux
    - job: deploy-windows-nanoserver
  script:
    - apk add --no-cache bash curl jq
    - |
      set -euo pipefail

      # Determine RELEASE_TYPE and MODULE_VERSION based on tag
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        MODULE_VERSION=$(echo "$CI_COMMIT_TAG" | grep -oE '[0-9]+\.[0-9]+\.[0-9](.*)')
        
        if [[ "$CI_COMMIT_TAG" == release-* ]]; then
          RELEASE_TYPE="GA"
        elif [[ "$CI_COMMIT_TAG" == beta-* ]]; then
          RELEASE_TYPE="BETA"
        elif [[ "$CI_COMMIT_TAG" == tag-* ]]; then
          RELEASE_TYPE="ALPHA"
        else
          echo "[ERROR] Unknown tag format"
          exit 1
        fi
      else
        echo "[ERROR] Not a tracked tag"
        exit 1
      fi

      BUILD_TAG="chronos"

      echo "[INFO] Updating Budibase version: BUILD_TAG=$BUILD_TAG, MODULE_VERSION=$MODULE_VERSION, RELEASE_TYPE=$RELEASE_TYPE"

      # Search for existing row
      SEARCH_PAYLOAD="{
        \"query\": {
          \"equal\": {
            \"internalName\": \"$BUILD_TAG\"
          }
        },
        \"paginate\": false,
        \"limit\": 1000
      }"

      SEARCH_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
        -H "x-budibase-app-id: $BUDIBASE_APP_ID" \
        -H "Content-Type: application/json" \
        -H "Accept: application/json" \
        -H "x-budibase-api-key: $BUDIBASE_API_KEY" \
        -d "$SEARCH_PAYLOAD" \
        "$BUDIBASE_BASE_URL/tables/datasource_plus_3dbc0976d090472f82658f287ec8ad6d__AvailableAgents/rows/search")

      SEARCH_BODY=$(echo "$SEARCH_RESPONSE" | sed -e '$d')
      SEARCH_STATUS=$(echo "$SEARCH_RESPONSE" | tail -n 1)

      if [ "$SEARCH_STATUS" -ne 200 ]; then
        echo "Failed to search for row. HTTP Status: $SEARCH_STATUS"
        echo "Response: $SEARCH_BODY"
        echo "Search Payload: $SEARCH_PAYLOAD"
        exit 1
      fi

      ROW_ID=$(echo "$SEARCH_BODY" | jq -r '.data[0]._id // empty')

      if [ -z "$ROW_ID" ]; then
        echo "No matching row found for INTERNAL_NAME: $BUILD_TAG"
        exit 1
      fi

      # Prepare update payload based on release type
      if [ "$RELEASE_TYPE" = "ALPHA" ]; then
        UPDATE_PAYLOAD="{
          \"latestVersionAlpha\": \"$MODULE_VERSION\"
        }"
      elif [ "$RELEASE_TYPE" = "BETA" ]; then
        UPDATE_PAYLOAD="{
          \"latestVersionBeta\": \"$MODULE_VERSION\"
        }"
      elif [ "$RELEASE_TYPE" = "GA" ]; then
        UPDATE_PAYLOAD="{
          \"latestVersionGA\": \"$MODULE_VERSION\"
        }"
      else
        echo "Unrecognized value: $RELEASE_TYPE"
        exit 1
      fi

      # Update the row
      UPDATE_RESPONSE=$(curl -s -w "\n%{http_code}" -X PUT \
        -H "x-budibase-app-id: $BUDIBASE_APP_ID" \
        -H "Content-Type: application/json" \
        -H "Accept: application/json" \
        -H "x-budibase-api-key: $BUDIBASE_API_KEY" \
        -d "$UPDATE_PAYLOAD" \
        "$BUDIBASE_BASE_URL/tables/datasource_plus_3dbc0976d090472f82658f287ec8ad6d__AvailableAgents/rows/$ROW_ID")

      UPDATE_BODY=$(echo "$UPDATE_RESPONSE" | sed -e '$d')
      UPDATE_STATUS=$(echo "$UPDATE_RESPONSE" | tail -n 1)

      echo "Budibase API update response code: $UPDATE_STATUS"
      echo "Budibase API update response: $UPDATE_BODY"

      if [ "$UPDATE_STATUS" -ge 200 ] && [ "$UPDATE_STATUS" -lt 300 ]; then
          echo "Successfully updated version on budibase"
      else
          echo "Failed to update version on budibase. HTTP Status: $UPDATE_STATUS"
          exit 1
      fi
  rules:
    - if: "$CI_COMMIT_TAG =~ /^release-/"
    - if: "$CI_COMMIT_TAG =~ /^beta-/"
    - if: "$CI_COMMIT_TAG =~ /^tag-/"

test:
  stage: test
  image: python:3.12-slim
  script:
    - apt-get update
    - apt-get install -y --no-install-recommends gcc
    - pip install --upgrade pip
    - pip install pytest pytest-cov pytest-asyncio
    - grep -vE "^(gluesync-sdk|pyjks)" requirements.txt > /tmp/requirements-ci.txt
    - pip install -r /tmp/requirements-ci.txt
    - pip download --no-deps -d /tmp/sdk-check "$(grep -E '^gluesync-sdk' requirements.txt)"
    - mkdir -p logs
    - sh tests/entrypoint/test-run-as.sh
    - python -m pytest tests/ -v --ignore=tests/test_api.py --ignore=tests/test_corehub_integration.py --ignore=tests/test_cron_jobs.py --ignore=tests/test_client_resilience_pytest.py --ignore=tests/test_chained_events.py --ignore=tests/security/test_auth_dependencies.py --ignore=tests/security/test_corehub_introspect.py --cov=. --cov-report=xml:coverage.xml --cov-report=term --junitxml=test-results.xml
  artifacts:
    when: always
    paths:
      - coverage.xml
    reports:
      junit: test-results.xml
    expire_in: 1 day
  coverage: "/TOTAL.+ ([0-9]{1,3}%)/"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

build-sonar:
  stage: build-sonar
  image:
    name: sonarsource/sonar-scanner-cli:11
    entrypoint: [""]
  cache:
    policy: pull-push
    key: "sonar-cache-$CI_COMMIT_REF_SLUG"
    paths:
      - "${SONAR_USER_HOME}/cache"
      - sonar-scanner/
  needs:
    - job: test
      artifacts: true
  script:
    - sonar-scanner -Dsonar.host.url="${SONAR_HOST_URL}" -Dsonar.projectKey="${SONAR_PROJECT_KEY}" -Dsonar.sources=gluesync_scheduler -Dsonar.tests=tests -Dsonar.python.version=3.12 -Dsonar.python.coverage.reportPaths=coverage.xml -Dsonar.qualitygate.wait=true
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'master'
    - if: $CI_COMMIT_BRANCH == 'main'
    - if: $CI_COMMIT_BRANCH == 'develop'

# The Chronos sandbox (sandbox/README.md): the real Chronos against a fake Core Hub with a controlled
# clock, every function plus the DST nights of GSSD-1457, split over 4 shards. It finds real defects,
# so a run is green when it finds nothing beyond sandbox/known-findings.json (and every entry there
# still occurs): the rule is in sandbox/lib/gate.mjs. Each job runs its OWN dockerd (privileged,
# docker:dind image), so concurrent pipelines never share a daemon and the sandbox's bind-mount paths
# under $CI_PROJECT_DIR exist for the daemon that mounts them. Everything happens in
# ci/sandbox-job.sh, which is also how to reproduce a job locally.
# Docker Hub is never contacted: the job image (ci/sandbox-ci.Dockerfile, hosted in Nexus) has Node 24
# and the fake's npm dependency, and SANDBOX_IMAGE_MIRROR makes the sandbox pull its base images from
# Nexus. Building the Chronos image downloads what its Dockerfiles always do (Chainguard base, PyPI,
# package repositories).

# Builds the Chronos image once per pipeline (repository Dockerfile plus the sandbox overlay) and hands
# it to the shards, which `docker load` it instead of building it four times. Starts at once, next to
# the unit tests.
sandbox_image:
  stage: sandbox-build
  image:
    name: nexus.hq.molo17.com/molo17-local/chronos-sandbox-ci:1
    # The script starts dockerd itself through the image's entrypoint script.
    entrypoint: ['']
  needs: []
  interruptible: true
  timeout: 40m
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
  script:
    - sh ci/sandbox-job.sh build
  artifacts:
    expire_in: 1 day
    paths:
      - sandbox/image/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# The scenarios, `parallel: 4`: shard i of 4 runs the scenario list defined in ci/sandbox-job.sh.
sandbox:
  stage: sandbox
  image:
    name: nexus.hq.molo17.com/molo17-local/chronos-sandbox-ci:1
    entrypoint: ['']
  needs:
    - job: sandbox_image
      artifacts: true
  interruptible: true
  timeout: 60m
  parallel: 4
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    SANDBOX_IMAGE_MIRROR: nexus.hq.molo17.com/molo17-local
  script:
    # parallel: 4 sets CI_NODE_INDEX (1-based) and CI_NODE_TOTAL; the script reads them.
    - sh ci/sandbox-job.sh
  artifacts:
    when: always
    expire_in: 2 weeks
    paths:
      - sandbox/reports/
    reports:
      junit: sandbox/reports/*/junit.xml
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
