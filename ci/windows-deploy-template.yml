.windows-deploy-template:
  stage: deploy
  script:
    # Fail immediately on any error
    - $ErrorActionPreference = "Stop"

    # Docker login
    - Write-Host "Logging into Docker registry..."
    - $env:CI_REGISTRY_PASSWORD | docker login -u "$env:CI_REGISTRY_USER" --password-stdin
    - if ($LASTEXITCODE -ne 0) { throw "❌ Docker login failed" }
    - Write-Host "✅ Docker login successful"

    # Extract version from tag
    - "Write-Host Processing tag: $env:CI_COMMIT_TAG"
    - $TAG_PART = [regex]::Match($env:CI_COMMIT_TAG, '[0-9]+\.[0-9]+\.[0-9](.*)').Value
    - if (-not $TAG_PART) { throw "❌ Could not extract version from tag" }
    - $IMAGE_NAME = "molo17/$env:APP_NAME"
    - $VERSION_TAG_WINDOWS = "${IMAGE_NAME}:${TAG_PART}-win-nanoserver-$env:WINDOWS_TAG"
    - "Write-Host Image name: $IMAGE_NAME; Write-Host Version tag: $VERSION_TAG_WINDOWS"

    # Determine release type for FTP destination
    - |
      if ($env:CI_COMMIT_TAG -match '^release-') {
        $env:RELEASE_TYPE = 'GA'
      }
      elseif ($env:CI_COMMIT_TAG -match '^beta-') {
        $env:RELEASE_TYPE = 'BETA'
      }
      elseif ($env:CI_COMMIT_TAG -match '^tag-') {
        $env:RELEASE_TYPE = 'ALPHA'
      }
      else {
        throw "❌ Unknown tag format: $env:CI_COMMIT_TAG"
      }

      $script:ReleaseSuffix = $env:RELEASE_TYPE.ToLowerInvariant()

      switch ($env:RELEASE_TYPE) {
        'GA' { $script:FTP_RELEASE_DIR = '/releases/ga/windows' }
        'BETA' { $script:FTP_RELEASE_DIR = '/releases/beta/windows' }
        'ALPHA' { $script:FTP_RELEASE_DIR = '/releases/alpha/windows' }
        'INTERNAL_TEST' { $script:FTP_RELEASE_DIR = '/releases/internal/windows' }
        Default { throw "❌ Unsupported RELEASE_TYPE: $env:RELEASE_TYPE" }
      }

      function Upload-FtpFile {
          param(
              [Parameter(Mandatory = $true)][string] $LocalPath,
              [Parameter(Mandatory = $true)][string] $RemoteUri,
              [Parameter(Mandatory = $true)][string] $Username,
              [Parameter(Mandatory = $true)][string] $Password
          )

          if (-not (Test-Path $LocalPath)) {
              throw "Local file '$LocalPath' not found."
          }

          Write-Host "Starting FTP upload to $RemoteUri"
          $ftpRequest = [System.Net.FtpWebRequest]::Create($RemoteUri)
          $ftpRequest.Method = [System.Net.WebRequestMethods+Ftp]::UploadFile
          $ftpRequest.Credentials = New-Object System.Net.NetworkCredential($Username, $Password)
          $ftpRequest.UseBinary = $true
          $ftpRequest.UsePassive = $true
          $ftpRequest.KeepAlive = $false

          $fileContent = [System.IO.File]::ReadAllBytes($LocalPath)
          $ftpRequest.ContentLength = $fileContent.Length

          $requestStream = $null
          $response = $null

          try {
              $requestStream = $ftpRequest.GetRequestStream()
              $requestStream.Write($fileContent, 0, $fileContent.Length)
              $requestStream.Flush()
              $requestStream.Dispose()
              $requestStream = $null

              $response = $ftpRequest.GetResponse()
              $statusDescription = $response.StatusDescription

              try {
                  $response.Close()
              }
              catch {
                  Write-Warning "FTP server closed connection early: $_"
              }

              Write-Host "FTP upload completed ($statusDescription)"
          }
          catch {
              throw "FTP upload failed: $_"
          }
          finally {
              if ($requestStream) { $requestStream.Dispose() }
              if ($response) { $response.Dispose() }
          }
      }

    # Initialize git submodules
    - Write-Host "Initializing git submodules..."
    - git submodule update --init --recursive
    - if ($LASTEXITCODE -ne 0) { throw "❌ Git submodule update failed" }
    - Write-Host "✅ Submodules ready"

    # Create VERSION file
    - Set-Content -Path "VERSION" -Value $TAG_PART
    - "Write-Host ✅ VERSION file created with content: $(Get-Content VERSION)"

    # Build Windows Docker image (conditional on WINDOWS_TAG)
    - |
      if ($env:WINDOWS_TAG -eq "ltsc2019") {
          Write-Host "Building Docker image for LTSC2019..."
      }
      else {
          Write-Host "Building Docker image for $env:WINDOWS_TAG using default Server Core..."
      }

    - docker build --file Dockerfile.windows `
      --build-arg WINDOWS_TAG="$env:WINDOWS_TAG" `
      --tag "$VERSION_TAG_WINDOWS" .

      if ($LASTEXITCODE -ne 0) { throw "❌ Docker build failed" }
      Write-Host "✅ Docker build completed successfully for $env:WINDOWS_TAG"

    # Save tarball and upload to FTP before pushing images
    - |
      $tarDir = Join-Path $env:CI_PROJECT_DIR "docker-images-windows"
      $null = New-Item -ItemType Directory -Path $tarDir -Force
      $baseName = "{0}-{1}-{2}" -f $env:APP_NAME, $script:ReleaseSuffix, $env:WINDOWS_TAG
      $rawTarName = "${baseName}.tar"
      $compressedTarName = "${rawTarName}.gz"
      $rawTarPath = Join-Path $tarDir $rawTarName
      $tarPath = Join-Path $tarDir $compressedTarName

      Write-Host "Saving image $VERSION_TAG_WINDOWS to $rawTarPath"
      docker save "$VERSION_TAG_WINDOWS" -o $rawTarPath
      if ($LASTEXITCODE -ne 0) { throw "❌ Docker save failed" }

      Write-Host "Compressing saved image to $tarPath"
      $inputStream = $null
      $outputStream = $null
      $gzipStream = $null
      try {
          $inputStream = [System.IO.File]::OpenRead($rawTarPath)
          $outputStream = [System.IO.File]::Create($tarPath)
          $gzipStream = New-Object System.IO.Compression.GzipStream($outputStream, [System.IO.Compression.CompressionLevel]::Optimal)
          $inputStream.CopyTo($gzipStream)
      }
      finally {
          if ($gzipStream) { $gzipStream.Dispose() }
          if ($outputStream) { $outputStream.Dispose() }
          if ($inputStream) { $inputStream.Dispose() }
      }

      Remove-Item -Path $rawTarPath -Force -ErrorAction SilentlyContinue

      $ftpUri = "ftp://$env:FTP_SITE$script:FTP_RELEASE_DIR/$compressedTarName"
      Write-Host "Uploading $compressedTarName to $ftpUri"
      Upload-FtpFile -LocalPath $tarPath -RemoteUri $ftpUri -Username $env:FTP_USER -Password $env:FTP_PASSWORD

      Remove-Item -Path $tarPath -Force -ErrorAction SilentlyContinue

    # Push Windows Docker image
    - docker push "$VERSION_TAG_WINDOWS"
    - if ($LASTEXITCODE -ne 0) { throw "❌ Docker push failed" }
    - Write-Host "✅ Pushed $VERSION_TAG_WINDOWS"

    # Tag and push latest-windows for release branches
    - |
      if ($env:CI_COMMIT_TAG -match '^release-') {
        $LATEST_BASE = "${IMAGE_NAME}:latest"
        $LATEST_TAG = "${LATEST_BASE}-win-nanoserver-$env:WINDOWS_TAG"

        docker tag "$VERSION_TAG_WINDOWS" "$LATEST_TAG"
        if ($LASTEXITCODE -ne 0) { throw "❌ Docker tag failed" }

        docker push "$LATEST_TAG"
        if ($LASTEXITCODE -ne 0) { throw "❌ Docker push latest-windows failed" }

        Write-Host "✅ Pushed $LATEST_TAG"

        # Backwards compatibility for ltsc2022
        if ($env:WINDOWS_TAG -eq "ltsc2022") {
          $LEGACY_TAG = "${LATEST_BASE}-windows"
          docker tag "$VERSION_TAG_WINDOWS" "$LEGACY_TAG"
          if ($LASTEXITCODE -ne 0) { throw "❌ Docker tag legacy failed" }

          docker push "$LEGACY_TAG"
          if ($LASTEXITCODE -ne 0) { throw "❌ Docker push legacy failed" }

          Write-Host "✅ Pushed legacy tag $LEGACY_TAG (for ltsc2022)"
        }
      }

  rules:
    - if: $CI_COMMIT_TAG
